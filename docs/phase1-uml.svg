<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1010" viewBox="0 0 1120 1010" role="img" aria-labelledby="title">
  <title id="title">MiniComputer Phase 1 UML class diagram</title>
  <style>
    text { fill: #17212b; font-family: Arial, sans-serif; }
    .name { font-size: 16px; font-weight: bold; text-anchor: middle; }
    .member, .label { font-size: 14px; }
    .box { fill: white; stroke: #36414c; stroke-width: 1.3; }
    .line { stroke: #36414c; stroke-width: 1.3; fill: none; }
  </style>
  <rect width="1120" height="1010" fill="white"/>
  <text x="20" y="30" font-size="22" font-weight="bold">MiniComputer Phase 1 UML</text>
  <path class="line" stroke-dasharray="5 4" d="M560 212 V318"/>
  <path class="line" d="M554 308 L560 318 L566 308"/>
  <text class="label" x="572" y="287">creates and uses</text>
  <path class="line" d="M410 641 V666 H201 V719 M560 641 V719 M710 641 V666 H919 V719"/>
  <path fill="#36414c" d="M410 621 L417 631 L410 641 L403 631 Z M560 621 L567 631 L560 641 L553 631 Z M710 621 L717 631 L710 641 L703 631 Z"/>
  <text class="label" x="423" y="651">1</text>
  <text class="label" x="573" y="651">1</text>
  <text class="label" x="723" y="651">1</text>
  <text class="label" x="212" y="708">1</text>
  <text class="label" x="571" y="708">1</text>
  <text class="label" x="930" y="708">1</text>
  <g transform="translate(318 54)">
    <rect class="box" width="484" height="158"/>
    <rect x="1" y="1" width="482" height="31" fill="#eef1f4"/>
    <text class="name" x="242" y="22">Main</text>
    <path class="line" d="M0 32 H484"/>
    <text class="member" x="12" y="52">+ main(args : String[]) : void</text>
    <text class="member" x="12" y="71">- createComputer(input : Scanner) : Computer</text>
    <text class="member" x="12" y="90">- runMenu(input : Scanner, computer : Computer) : void</text>
    <text class="member" x="12" y="109">- printMenu() : void</text>
    <text class="member" x="12" y="128">- readName(input : Scanner, prompt : String) : String</text>
    <text class="member" x="12" y="147">- readNumber(input : Scanner, prompt : String, minimum : int) : int</text>
  </g>
  <g transform="translate(144 318)">
    <rect class="box" width="832" height="303"/>
    <rect x="1" y="1" width="830" height="31" fill="#eef1f4"/>
    <text class="name" x="416" y="22">Computer</text>
    <path class="line" d="M0 32 H832 M0 139 H832"/>
    <text class="member" x="12" y="52">- name : String</text>
    <text class="member" x="12" y="71">- cpu : CPU</text>
    <text class="member" x="12" y="90">- ram : RAM</text>
    <text class="member" x="12" y="109">- storage : Storage</text>
    <text class="member" x="12" y="128">- poweredOn : boolean</text>
    <text class="member" x="12" y="159">+ Computer(name : String, cpuModel : String, cores : int, clockMHz : int, ramMB : int, storageName : String, storageGB : int)</text>
    <text class="member" x="12" y="178">+ powerOn() : boolean</text>
    <text class="member" x="12" y="197">+ shutDown() : boolean</text>
    <text class="member" x="12" y="216">+ isPoweredOn() : boolean</text>
    <text class="member" x="12" y="235">+ getCpu() : CPU</text>
    <text class="member" x="12" y="254">+ getRam() : RAM</text>
    <text class="member" x="12" y="273">+ getStorage() : Storage</text>
    <text class="member" x="12" y="292">+ getSpecifications() : String</text>
  </g>
  <g transform="translate(20 719)">
    <rect class="box" width="362" height="246"/>
    <rect x="1" y="1" width="360" height="31" fill="#eef1f4"/>
    <text class="name" x="181" y="22">CPU</text>
    <path class="line" d="M0 32 H362 M0 139 H362"/>
    <text class="member" x="12" y="52">- model : String</text>
    <text class="member" x="12" y="71">- cores : int</text>
    <text class="member" x="12" y="90">- clockMHz : int</text>
    <text class="member" x="12" y="109">- accumulator : int</text>
    <text class="member" x="12" y="128">- programCounter : int</text>
    <text class="member" x="12" y="159">+ CPU(model : String, cores : int, clockMHz : int)</text>
    <text class="member" x="12" y="178">+ getAccumulator() : int</text>
    <text class="member" x="12" y="197">+ getProgramCounter() : int</text>
    <text class="member" x="12" y="216">+ resetRegisters() : void</text>
    <text class="member" x="12" y="235">+ getSpecifications() : String</text>
  </g>
  <g transform="translate(399 719)">
    <rect class="box" width="322" height="208"/>
    <rect x="1" y="1" width="320" height="31" fill="#eef1f4"/>
    <text class="name" x="161" y="22">RAM</text>
    <path class="line" d="M0 32 H322 M0 82 H322"/>
    <text class="member" x="12" y="52">- totalMB : int</text>
    <text class="member" x="12" y="71">- usedMB : int</text>
    <text class="member" x="12" y="102">+ RAM(totalMB : int)</text>
    <text class="member" x="12" y="121">+ getTotalMB() : int</text>
    <text class="member" x="12" y="140">+ getUsedMB() : int</text>
    <text class="member" x="12" y="159">+ getAvailableMB() : int</text>
    <text class="member" x="12" y="178">+ allocate(amountMB : int) : boolean</text>
    <text class="member" x="12" y="197">+ release(amountMB : int) : boolean</text>
  </g>
  <g transform="translate(738 719)">
    <rect class="box" width="362" height="208"/>
    <rect x="1" y="1" width="360" height="31" fill="#eef1f4"/>
    <text class="name" x="181" y="22">Storage</text>
    <path class="line" d="M0 32 H362 M0 101 H362"/>
    <text class="member" x="12" y="52">- name : String</text>
    <text class="member" x="12" y="71">- totalGB : int</text>
    <text class="member" x="12" y="90">- usedGB : int</text>
    <text class="member" x="12" y="121">+ Storage(name : String, totalGB : int)</text>
    <text class="member" x="12" y="140">+ getAvailableGB() : int</text>
    <text class="member" x="12" y="159">+ store(amountGB : int) : boolean</text>
    <text class="member" x="12" y="178">+ remove(amountGB : int) : boolean</text>
    <text class="member" x="12" y="197">+ getSpecifications() : String</text>
  </g>
</svg>
